<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0B0F19"/>
  <!-- Subtle border highlight -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#3B82F6" stroke-opacity="0.3"/>
  <g fill="#3B82F6">
    <!-- Antennae -->
    <rect x="9" y="8" width="2" height="2" rx="0.4"/>
    <rect x="21" y="8" width="2" height="2" rx="0.4"/>
    <rect x="11" y="10" width="2" height="2" rx="0.4"/>
    <rect x="19" y="10" width="2" height="2" rx="0.4"/>
    <!-- Head / Brow -->
    <rect x="7" y="12" width="18" height="2" rx="0.4"/>
    <!-- Eye Row body parts -->
    <rect x="5" y="14" width="4" height="2" rx="0.4"/>
    <rect x="11" y="14" width="10" height="2" rx="0.4"/>
    <rect x="23" y="14" width="4" height="2" rx="0.4"/>
    <!-- Middle Torso -->
    <rect x="5" y="16" width="22" height="2" rx="0.4"/>
    <!-- Lower torso / mouth cutouts -->
    <rect x="5" y="18" width="2" height="2" rx="0.4"/>
    <rect x="9" y="18" width="14" height="2" rx="0.4"/>
    <rect x="25" y="18" width="2" height="2" rx="0.4"/>
    <!-- Legs -->
    <rect x="5" y="20" width="2" height="2" rx="0.4"/>
    <rect x="9" y="20" width="2" height="2" rx="0.4"/>
    <rect x="21" y="20" width="2" height="2" rx="0.4"/>
    <rect x="25" y="20" width="2" height="2" rx="0.4"/>
    <!-- Feet -->
    <rect x="11" y="22" width="4" height="2" rx="0.4"/>
    <rect x="17" y="22" width="4" height="2" rx="0.4"/>
  </g>
  <!-- Eyes -->
  <g fill="#FFFFFF">
    <rect x="9" y="14" width="2" height="2" rx="0.4"/>
    <rect x="21" y="14" width="2" height="2" rx="0.4"/>
  </g>
</svg>
